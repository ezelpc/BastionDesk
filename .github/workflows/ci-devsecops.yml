name: BastionDesk DevSecOps

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep

      - name: SAST
        run: semgrep scan --config auto --error --exclude node_modules --exclude dist --exclude build .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm install --ignore-scripts

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,.git,dist,build

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm install --ignore-scripts

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

  container:
    name: Container security
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        run: docker build --pull -t bastiondesk-dev:ci -f .devcontainer/Dockerfile .devcontainer

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bastiondesk-dev:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
